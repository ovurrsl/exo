[package]
name = "exo-windows-desktop"
version = "0.3.70"
edition = "2021"
rust-version = "1.95"
publish = false
default-run = "exo-windows-desktop"
autotests = false

[features]
process-test-helper = []
firewall-helper = []

[[bin]]
name = "exo-firewall-helper"
path = "src/firewall_helper.rs"
required-features = ["firewall-helper"]

[[bin]]
name = "exo-process-test-helper"
path = "tests/process_helper.rs"
required-features = ["process-test-helper"]

[[test]]
name = "native_lifecycle"
path = "tests/native_lifecycle.rs"
required-features = ["process-test-helper"]

[[bin]]
name = "exo-frozen-desktop-probe"
path = "tests/frozen_desktop_probe.rs"
required-features = ["process-test-helper"]

# This app must never join or change the Mac/Python Rust workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "sync",
  "time",
  "rt-multi-thread",
  "macros",
  "process",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = [
  "windows-native",
] }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Environment",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
